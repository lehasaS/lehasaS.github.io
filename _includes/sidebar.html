<div class="sidebar">
  <div class="sidebar-sticky">
    <div class="sidebar-content">
      <div class="sidebar-about">
        <h1 class="sidebar-title">
          <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
        </h1>
        <p class="sidebar-tagline">{{ site.description }}</p>
      </div>

      <hr class="sidebar-divider">

      <nav class="sidebar-nav sidebar-nav--primary" aria-label="Primary navigation">
        <a class="sidebar-nav-item{% if page.url == '/' %} active{% endif %}" href="{{ '/' | relative_url }}">Home</a>
        <a class="sidebar-nav-item{% if page.url contains 'about' %} active{% endif %}" href="{{ '/about' | relative_url }}">About Me</a>
        <a class="sidebar-nav-item{% if page.url contains '/series' %} active{% endif %}" href="{{ '/series/' | relative_url }}">Series</a>
        <a class="sidebar-nav-item{% if page.url contains '/tags' %} active{% endif %}" href="{{ '/tags/' | relative_url }}">Tags</a>
      </nav>

      <hr class="sidebar-divider">

      <nav class="sidebar-nav sidebar-nav--social" aria-label="Social links">
        <a class="sidebar-nav-item" href="{{ site.github.repo }}" target="_blank" rel="noopener">
          <svg class="sidebar-nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M12 2C6.48 2 2 6.58 2 12.26c0 4.52 2.87 8.35 6.84 9.7.5.1.68-.22.68-.49 0-.24-.01-.88-.01-1.73-2.78.62-3.37-1.38-3.37-1.38-.45-1.2-1.11-1.52-1.11-1.52-.9-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.89 1.55 2.34 1.1 2.91.84.09-.66.35-1.1.63-1.35-2.22-.26-4.56-1.15-4.56-5.1 0-1.13.39-2.06 1.03-2.78-.1-.26-.45-1.3.1-2.7 0 0 .84-.27 2.75 1.06a9.2 9.2 0 0 1 2.5-.35c.85 0 1.7.12 2.5.35 1.9-1.33 2.74-1.06 2.74-1.06.55 1.4.2 2.44.1 2.7.64.72 1.02 1.65 1.02 2.78 0 3.97-2.35 4.84-4.59 5.1.36.32.68.95.68 1.92 0 1.38-.01 2.5-.01 2.84 0 .27.18.6.69.49A10.2 10.2 0 0 0 22 12.26C22 6.58 17.52 2 12 2z"/>
          </svg>
          <span>GitHub</span>
        </a>
        <a class="sidebar-nav-item" href="{{ site.social.linkedIn }}" target="_blank" rel="noopener">
          <svg class="sidebar-nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.86-3.04-1.86 0-2.15 1.45-2.15 2.95v5.66H9.34V9h3.41v1.56h.05c.47-.9 1.63-1.86 3.36-1.86 3.59 0 4.25 2.36 4.25 5.43v6.32zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45zM22 2H2C.9 2 0 2.9 0 4v16c0 1.1.9 2 2 2h20c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
          </svg>
          <span>LinkedIn</span>
        </a>
      </nav>
    </div>

    <div class="sidebar-footer">
      <hr class="sidebar-divider">

      <footer class="sidebar-meta">
        <span class="sidebar-meta-item">v{{ site.version }}</span>
        <span class="sidebar-meta-item">&copy; {{ site.time | date: '%Y' }}</span>
      </footer>
    </div>
  </div>
</div>
